<html lang="he" dir="rtl">
<head>

  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent1: #6c8ef5;
      --accent2: #f5a623;
      --accent3: #4ecdc4;
      --text: #e8eaf6;
      --text-muted: #8892b0;
      --badge-press: #1e3a5f;
      --badge-press-text: #7eb8f7;
      --badge-acad: #1a3a2a;
      --badge-acad-text: #5fba7d;
      --tag-bg: #252940;
      --tag-text: #a8b4d8;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      max-width: 1200px;
      margin: 0 auto 2.5rem;
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent1) 0%, var(--accent3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    header p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      text-align: center;
      min-width: 130px;
    }
    .stat-card .num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent1);
      line-height: 1;
    }
    .stat-card .label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* ── Controls ── */
    .controls {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }
    .search-wrap input:focus { border-color: var(--accent1); }
    .search-wrap .icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .filter-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.45rem 1rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--accent1); color: var(--text); }
    .filter-btn.active {
      background: var(--accent1);
      border-color: var(--accent1);
      color: #fff;
    }
    .count-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 10px;
      padding: 0.1rem 0.5rem;
      font-size: 0.75rem;
      margin-right: 0.3rem; /* RTL: visually left */
    }

    /* ── Section heading ── */
    .section-heading {
      max-width: 1200px;
      margin: 2.5rem auto 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-heading h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .section-heading .pill {
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .pill-press { background: var(--badge-press); color: var(--badge-press-text); }
    .pill-acad  { background: var(--badge-acad);  color: var(--badge-acad-text); }
    .section-divider {
      max-width: 1200px;
      margin: 0 auto 1.2rem;
      border: none;
      border-top: 1px solid var(--border);
    }

    /* ── Institution group label ── */
    .inst-label {
      max-width: 1200px;
      margin: 1.5rem auto 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--accent2);
      font-size: 0.88rem;
      font-weight: 600;
    }
    .inst-label::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 1.1em;
      background: var(--accent2);
      border-radius: 2px;
    }

    /* ── Table ── */
    .table-wrap {
      max-width: 1200px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    thead tr { background: var(--surface2); }
    thead th {
      padding: 0.8rem 1rem;
      text-align: right;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--text); }
    thead th .sort-icon { margin-right: 4px; opacity: 0.4; font-size: 0.7rem; }
    thead th.sorted .sort-icon { opacity: 1; color: var(--accent1); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td {
      padding: 0.75rem 1rem;
      vertical-align: middle;
    }

    .td-name { font-weight: 600; color: var(--text); }
    .td-role { color: var(--text-muted); font-size: 0.88rem; }
    .td-where { font-size: 0.88rem; }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      letter-spacing: 0.03em;
      margin-left: 0.4rem;
      vertical-align: middle;
    }
    .badge-press { background: var(--badge-press); color: var(--badge-press-text); }
    .badge-acad  { background: var(--badge-acad);  color: var(--badge-acad-text); }

    .where-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .td-src { white-space: nowrap; }
    .src-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--tag-bg);
      color: var(--accent1);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .src-link:hover { background: var(--accent1); color: #fff; }

    /* Hidden rows */
    tr.hidden { display: none; }

    /* ── No results ── */
    .no-results {
      max-width: 1200px;
      margin: 2rem auto;
      text-align: center;
      color: var(--text-muted);
      display: none;
    }

    /* ── Footer ── */
    footer {
      max-width: 1200px;
      margin: 3rem auto 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    @media (max-width: 640px) {
      .stats { gap: 0.75rem; }
      .stat-card { min-width: 100px; padding: 0.6rem 1rem; }
      .stat-card .num { font-size: 1.5rem; }
      table { font-size: 0.82rem; }
      tbody td { padding: 0.6rem 0.7rem; }
    }
  </style>
</head>

// ── Build stats ──
const total = people.length;
const pressCount = people.filter(p => p.cat === "עיתונאים ומבקרים").length;
const acadCount  = people.filter(p => p.cat === "סגל אקדמי").length;
const institutions = [...new Set(people.filter(p => p.inst).map(p => p.where))].length;

document.getElementById('stat-total').textContent = total;
document.getElementById('stat-press').textContent = pressCount;
document.getElementById('stat-acad').textContent  = acadCount;
document.getElementById('stat-inst').textContent  = institutions;
document.getElementById('cnt-all').textContent    = total;
document.getElementById('cnt-press').textContent  = pressCount;
document.getElementById('cnt-acad').textContent   = acadCount;

// ── State ──
let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterTable();
}

function filterTable() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const rows = document.querySelectorAll('tbody tr[data-idx]');
  let visible = 0;
  rows.forEach(row => {
    const idx = parseInt(row.dataset.idx);
    const p   = people[idx];
    const matchCat = activeFilter === 'all' || p.cat === activeFilter;
    const matchQ   = !q || [p.name, p.role, p.where, p.inst||''].join(' ').toLowerCase().includes(q);
    if (matchCat && matchQ) { row.classList.remove('hidden'); visible++; }
    else                     row.classList.add('hidden');
  });

  // section headings
  document.querySelectorAll('.section-heading, .section-divider, .inst-label, .table-wrap').forEach(el => {
    el.classList.remove('hidden');
  });
  // hide empty section groups
  document.querySelectorAll('.inst-block').forEach(block => {
    const anyVisible = [...block.querySelectorAll('tbody tr[data-idx]')].some(r => !r.classList.contains('hidden'));
    block.style.display = anyVisible ? '' : 'none';
  });
  document.querySelectorAll('.cat-section').forEach(sec => {
    const anyVisible = [...sec.querySelectorAll('tbody tr[data-idx]')].some(r => !r.classList.contains('hidden'));
    sec.style.display = anyVisible ? '' : 'none';
  });

  document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
}

// ── Render ──
function render() {
  const container = document.getElementById('mainContent');

  // Section 1: Press
  const pressSection = document.createElement('div');
  pressSection.className = 'cat-section';

  const ph = document.createElement('div');
  ph.className = 'section-heading';
  ph.innerHTML = '<h2>עיתונאים, מבקרים ופודקאסטרים</h2><span class="pill pill-press">קטגוריה 1</span>';
  pressSection.appendChild(ph);

  const phr = document.createElement('hr');
  phr.className = 'section-divider';
  pressSection.appendChild(phr);

  const pressBlock = document.createElement('div');
  pressBlock.className = 'inst-block table-wrap';
  const pt = buildTable(people.filter(p => p.cat === "עיתונאים ומבקרים"), "עיתונאים ומבקרים");
  pressBlock.appendChild(pt);
  pressSection.appendChild(pressBlock);
  container.appendChild(pressSection);

  // Section 2: Academia
  const acadSection = document.createElement('div');
  acadSection.className = 'cat-section';

  const ah = document.createElement('div');
  ah.className = 'section-heading';
  ah.innerHTML = '<h2>סגל אקדמי — מוסדות הוראה</h2><span class="pill pill-acad">קטגוריה 2</span>';
  acadSection.appendChild(ah);

  const ahr = document.createElement('hr');
  ahr.className = 'section-divider';
  acadSection.appendChild(ahr);

  // Group by institution
  const acadPeople = people.filter(p => p.cat === "סגל אקדמי");
  const instMap = {};
  acadPeople.forEach(p => {
    const k = p.inst || p.where;
    if (!instMap[k]) instMap[k] = [];
    instMap[k].push(p);
  });

  Object.entries(instMap).forEach(([inst, group]) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'inst-block';

    const lbl = document.createElement('div');
    lbl.className = 'inst-label';
    lbl.textContent = inst;
    wrapper.appendChild(lbl);

    const tw = document.createElement('div');
    tw.className = 'table-wrap';
    tw.appendChild(buildTable(group, "סגל אקדמי"));
    wrapper.appendChild(tw);
    acadSection.appendChild(wrapper);
  });

  container.appendChild(acadSection);
}

function buildTable(rows, cat) {
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th>שם</th>
    <th>תפקיד</th>
    <th>איפה</th>
    <th>מקור</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  rows.forEach(p => {
    const globalIdx = people.indexOf(p);
    const tr = document.createElement('tr');
    tr.dataset.idx = globalIdx;
    const badgeCls = cat === "עיתונאים ומבקרים" ? 'badge-press' : 'badge-acad';
    const whereTags = p.where.split('·').map(w =>
      `<span class="tag">${w.trim()}</span>`
    ).join('');
    const srcUrl  = getSource(p);
    const srcHtml = srcUrl
      ? `<a href="${srcUrl}" target="_blank" rel="noopener" class="src-link">↗ מקור</a>`
      : '<span style="color:var(--text-muted)">—</span>';
    tr.innerHTML = `
      <td class="td-name">${p.name}</td>
      <td class="td-role">${p.role}</td>
      <td class="td-where"><div class="where-tags">${whereTags}</div></td>
      <td class="td-src">${srcHtml}</td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}
